<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Products | Vighya Trading, Bhiwani</title>
  <meta name="description" content="Vighya Trading products." />
  <meta name="theme-color" content="#0b1b33" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230b1b33'/%3E%3Cpath d='M3 6h5l3.5 8L10 18z' fill='%237b70f0'/%3E%3Cpath d='M14 6h5l-6.5 12-1.5-4z' fill='%23ff4d63'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="category">
  <div id="site-header"></div>
  <nav class="cat-strip" id="cat-strip" aria-label="Categories"></nav>

  <main>
    <section class="cat-hero">
      <div class="container cat-hero__inner">
        <div>
          <nav class="crumbs" aria-label="Breadcrumb"><a href="./">Home</a><span>/</span><a href="./#categories">Products</a><span>/</span><span id="crumbName"></span></nav>
          <div class="cat-hero__title"><span class="cat-hero__ico" id="catIcon"></span><h1 id="catName"></h1></div>
          <p class="lead" id="catBlurb"></p>
          <p class="cat-hero__count" id="catCount"></p>
          <div class="hero__ctas">
            <a class="btn btn--whatsapp" id="catAsk" data-wa-link>
              <svg class="ico" viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.3-.5 0-1 .2-3.3-.7a11.4 11.4 0 0 1-4.5-4c-.3-.5-1-1.5-1-2.8s.7-2 1-2.3a1 1 0 0 1 .7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6a8.2 8.2 0 0 0 1.5 1.9 7.4 7.4 0 0 0 2.2 1.3c.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3a2.4 2.4 0 0 1-.2 1.3z"/></svg>
              Ask for models & prices
            </a>
            <a class="btn btn--outline" data-phone-link>
              <svg class="ico" viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
              <span data-phone></span>
            </a>
          </div>
        </div>
        <div class="cat-hero__visual" id="catVisual"></div>
      </div>
    </section>

    <section class="section section--tight">
      <div class="container">
        <div class="tabs tabs--left" id="typeTabs" role="tablist" aria-label="Filter by type"></div>
        <div class="grid products" id="productGrid"></div>

        <div class="cta-band">
          <div>
            <h2>Don't see the exact model?</h2>
            <p>We have more models and ratings in the shop than listed here. Call or WhatsApp us, or visit us in Village Nangal, Bhiwani.</p>
          </div>
          <div class="cta-band__btns">
            <a class="btn btn--primary" data-phone-link>Call now</a>
            <a class="btn btn--ghost" data-map-link target="_blank" rel="noopener">Get directions</a>
          </div>
        </div>

        <div class="other-cats">
          <h3>Other categories</h3>
          <div class="other-cats__list" id="otherCats"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
